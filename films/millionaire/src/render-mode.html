<!doctype html>
<meta charset="utf-8">
<title>The Millionaire Who Lost Everything</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
         position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:#000;color:#e8dcc8;font:600 15px/1.5 system-ui,-apple-system,sans-serif;
        letter-spacing:.18em;text-transform:uppercase;cursor:pointer;z-index:9999}
  #gate.off{display:none}
</style>
<canvas id="stage" width="1280" height="720"></canvas>
<audio id="voice" preload="auto"></audio>
<div id="gate">Play &mdash; sound on</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  "use strict";
  var AUDIO_SRC = "";
  var THREE = window.THREE;

  // Deterministic pseudo-random. The render is sharded across processes and
  // restarted after crashes, so every frame must be reproducible; nothing may
  // call Math.random() once the scene is built.
  var NSEED = 1973;
  function rnd() {
    NSEED = (NSEED * 1103515245 + 12345) & 0x7fffffff;
    return NSEED / 0x7fffffff;
  }

  function mat(hex, o) {
    o = o || {};
    var m = new THREE.MeshLambertMaterial({ color: hex, flatShading: true });
    if (o.transparent) { m.transparent = true; m.opacity = o.opacity; }
    if (o.emissive) m.emissive = new THREE.Color(o.emissive);
    if (o.side) m.side = o.side;
    return m;
  }
  function emat(hex, op) {
    return new THREE.MeshBasicMaterial({ color: hex, transparent: true,
                                         opacity: op === undefined ? 1 : op });
  }

// ===== materials/palette.js ====================================
// materials/palette.js — modern American metropolitan.
//
// Two worlds, one palette. The empire is glass, steel, warm wood and a navy
// suit; the apartment is painted drywall, pine and cotton. The man's suit
// colour survives into the second half as the jacket he no longer wears, so
// the two halves read as the same person's life.
var PAL = {
  // glass and tower
  glass: 0x8fb6cc, glassDark: 0x5c7f96, glassLit: 0xbcd8e8,
  steel: 0x9aa0a6, steelDark: 0x6b7076, chrome: 0xc8ccd0,
  concrete: 0x8e8e8e, concreteDark: 0x6a6a6a,
  towerA: 0x7e8c99, towerB: 0x6b7885, towerC: 0x97a3ad, towerFar: 0xa8b3bd,

  // the executive office
  deskWood: 0x6b4a32, deskWoodDark: 0x4a3221, deskTop: 0x7d5a3e,
  leatherChair: 0x24242a, carpet: 0x4a4a52, stoneFloor: 0xb4ada4,
  shelf: 0x5c4634, artA: 0x3a5a7a, artB: 0x7a4a3a, plant: 0x4a6b42,
  plantPot: 0xd8d4cc, screen: 0x1a1e26, screenLit: 0x2a4a6a,

  // the hospital
  hospWall: 0xdce6ec, hospWallLo: 0xc2d2dc, hospFloor: 0xd8dde0,
  hospTrim: 0x7fa8bc, scrubs: 0x4a7f99, coat: 0xf0f2f4, hospChair: 0x6b8fa4,

  // the luxury residence
  homeWall: 0xcfc6ba, homeWallDark: 0x9a9288, homeFloor: 0x7d6349,
  couch: 0x55606b, couchDark: 0x3f4852, rugHome: 0x6b5a4a,
  counter: 0x3a3f46, lampWarm: 0xffc87a,

  // the modest apartment
  aptWall: 0xc8c2b4, aptWallDark: 0x9c968a, aptFloor: 0x8a7558,
  aptCouch: 0x7a705f, aptCouchDark: 0x5c5447, box: 0xb59264, boxDark: 0x8e7049,
  curtain: 0xd4cec0, pine: 0xa8874f,

  // street
  asphalt: 0x44464a, sidewalk: 0x9a9890, shopA: 0x8a6a52, shopB: 0x6a7a6a,
  carA: 0x3a4650, carB: 0x7a3a3a, carC: 0xcfd2d6, treeGreen: 0x4a6b3a,
  trunk: 0x5a4632, lampPost: 0x3a3e42,

  // people
  skinA: 0xd8ab86, skinB: 0xc08a5e, skinC: 0xa87350, skinD: 0xe0bb98,
  suitNavy: 0x2a3550, suitCharcoal: 0x33363c, shirtWhite: 0xeef0f2,
  tieA: 0x7a2a35, watch: 0xd4b45a,
  blouse: 0xb88ca0, skirtDark: 0x3a3a44,
  friendJacket: 0x4a5560, friendShirt: 0x9aa8b4,
  plainShirt: 0x7f8c99, plainShirtAlt: 0x8a8578, jeans: 0x4a5668,
  hairDark: 0x2a2420, hairGrey: 0x8a8880, hairSalt: 0x5a5650, hairMid: 0x4a3c30,
  hairWife: 0x4a3a30, hairBlonde: 0xa88a5e,

  // light / sky
  daySky: 0x8cb8e0, overcast: 0x9aa4ae, nightSky: 0x141a26,
  dawnSky: 0xf0a878, lampGlow: 0xffc87a, fluoro: 0xe8f2f6,
  rain: 0x9ab4c8
};


// ===== characters/rig.js =======================================
// characters/rig.js — one jointed low-poly body, reused for every character.
//
// The joint stack is hips -> torso -> chest -> neck -> head, so a curved spine
// and a lowered head compose instead of fighting each other. Faces have no
// blend shapes: expression is brow angle, eyelid position, jaw opening and the
// line of the shoulders, which is all that reads at these shot sizes anyway.
//
// Every character is built from this one function. Variation comes from cfg
// (skin, robe, hair, height, build, headwear) rather than from separate
// meshes, so a crowd is cheap and no two figures are identical.

function buildPerson(cfg) {
  cfg = cfg || {};
  var P = new THREE.Group();
  var skin = mat(cfg.skin || PAL.skinA);
  var cloth = mat(cfg.robe || PAL.robeCrowdA);
  var under = mat(cfg.under || cfg.robe || PAL.robeCrowdB);
  var hairM = mat(cfg.hair || PAL.hairDark);
  var scale = cfg.height || 1;
  var build = cfg.build || 1;          // 1 = average, >1 heavier
  P.scale.setScalar(scale);

  // ---- hips / torso / chest ----
  var hips = new THREE.Group();
  hips.position.y = 0.92;
  P.add(hips);

  var torso = new THREE.Group();
  hips.add(torso);

  var pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.40 * build, 0.24, 0.26), cloth);
  pelvis.position.y = 0.10;
  pelvis.castShadow = true;
  torso.add(pelvis);

  var chest = new THREE.Group();
  chest.position.y = 0.26;
  torso.add(chest);

  var ribs = new THREE.Mesh(new THREE.BoxGeometry(0.46 * build, 0.40, 0.28), cloth);
  ribs.position.y = 0.18;
  ribs.castShadow = true;
  chest.add(ribs);

  // Silhouette below the waist. `modern` gives trousers (the legs read on
  // their own); otherwise a tapered skirt, which is what sells a robe.
  // `robe` is returned either way so a costume change can recolour one thing.
  var robe;
  if (cfg.modern) {
    robe = new THREE.Mesh(new THREE.BoxGeometry(0.38 * build, 0.30, 0.27),
                          mat(cfg.trousers || cfg.robe || PAL.suitCharcoal));
    robe.position.y = -0.09;
    robe.castShadow = true;
    torso.add(robe);
  } else {
    robe = new THREE.Mesh(
      new THREE.CylinderGeometry(0.30 * build, 0.42 * build, 0.95, 7, 1, true), cloth);
    robe.position.y = -0.38;
    robe.castShadow = true;
    torso.add(robe);
  }

  // A suit jacket: two front panels with a gap, open over the shirt. Worn
  // open so the shirt colour stays visible, which is what makes the later
  // jacket-off change legible at a glance.
  var jacket = null;
  if (cfg.jacket) {
    jacket = new THREE.Group();
    var jm = mat(cfg.jacket);
    for (var js = -1; js <= 1; js += 2) {
      var panel = new THREE.Mesh(new THREE.BoxGeometry(0.19 * build, 0.66, 0.30), jm);
      panel.position.set(js * 0.145 * build, 0.04, 0.012);
      panel.castShadow = true;
      jacket.add(panel);
    }
    var back = new THREE.Mesh(new THREE.BoxGeometry(0.50 * build, 0.66, 0.08), jm);
    back.position.set(0, 0.04, -0.125);
    back.castShadow = true;
    jacket.add(back);
    var collarL = new THREE.Mesh(new THREE.BoxGeometry(0.10 * build, 0.20, 0.10), jm);
    collarL.position.set(-0.13 * build, 0.30, 0.10);
    collarL.rotation.z = 0.3;
    jacket.add(collarL);
    var collarR = collarL.clone();
    collarR.position.x = 0.13 * build;
    collarR.rotation.z = -0.3;
    jacket.add(collarR);
    chest.add(jacket);
  }

  if (cfg.tie) {
    var tie = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.34, 0.025), mat(cfg.tie));
    tie.position.set(0, 0.16, 0.148);
    chest.add(tie);
  }

  // The watch is its own object so it can come off on camera later.
  var watch = null;
  if (cfg.watch) {
    watch = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.035, 0.09),
                           mat(cfg.watch));
    watch.position.y = -0.255;
  }

  if (cfg.sash) {
    var sash = new THREE.Mesh(new THREE.BoxGeometry(0.48 * build, 0.09, 0.30), mat(cfg.sash));
    sash.position.y = 0.00;
    chest.add(sash);
  }
  if (cfg.belt) {
    var belt = new THREE.Mesh(new THREE.BoxGeometry(0.42 * build, 0.07, 0.28), mat(PAL.leather));
    belt.position.y = 0.00;
    torso.add(belt);
  }
  if (cfg.mantle) {   // a cloak over one shoulder
    var mantle = new THREE.Mesh(new THREE.BoxGeometry(0.50 * build, 0.52, 0.10), mat(cfg.mantle));
    mantle.position.set(0, 0.10, -0.17);
    chest.add(mantle);
  }

  // ---- neck / head ----
  var neck = new THREE.Group();
  neck.position.y = 0.40;
  chest.add(neck);

  var neckM = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.13, 6), skin);
  neckM.position.y = 0.05;
  neck.add(neckM);

  var head = new THREE.Group();
  head.position.y = 0.17;
  neck.add(head);

  var skull = new THREE.Mesh(new THREE.BoxGeometry(0.235, 0.27, 0.235), skin);
  skull.castShadow = true;
  head.add(skull);

  var brow = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.03), skin);
  brow.position.set(0, 0.055, 0.122);
  head.add(brow);

  // jaw hinges at the back so the chin swings, as a jaw does
  var jaw = new THREE.Group();
  jaw.position.set(0, -0.085, -0.06);
  head.add(jaw);
  var jawM = new THREE.Mesh(new THREE.BoxGeometry(0.205, 0.085, 0.215), skin);
  jawM.position.set(0, -0.02, 0.085);
  jaw.add(jawM);

  var mouth = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.022, 0.012), mat(0x4a2c22));
  mouth.position.set(0, -0.012, 0.196);
  jaw.add(mouth);

  function eye(sx) {
    var g = new THREE.Group();
    g.position.set(sx * 0.062, 0.008, 0.108);
    var white = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.040, 0.012), mat(0xf0e6d8));
    g.add(white);
    var iris = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.026, 0.014), mat(cfg.eye || 0x3b2a1c));
    iris.position.z = 0.004;
    g.add(iris);
    // lid slides down over the eye - blinks and the half-lidded blind look
    var lid = new THREE.Mesh(new THREE.BoxGeometry(0.056, 0.044, 0.016), skin);
    lid.position.set(0, 0.044, 0.006);
    g.add(lid);
    var browBar = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.016, 0.014), hairM);
    browBar.position.set(0, 0.052, 0.012);
    g.add(browBar);
    head.add(g);
    return { g: g, lid: lid, brow: browBar, iris: iris };
  }
  var eyeL = eye(-1), eyeR = eye(1);

  // ---- hair / beard / headwear ----
  if (!cfg.bald) {
    var cap = new THREE.Mesh(new THREE.BoxGeometry(0.252, 0.10, 0.252), hairM);
    cap.position.y = 0.125;
    head.add(cap);
    var backHair = new THREE.Mesh(new THREE.BoxGeometry(0.248, 0.16, 0.06), hairM);
    backHair.position.set(0, 0.03, -0.106);
    head.add(backHair);
  }
  if (cfg.beard) {
    var beard = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.12, 0.075), mat(cfg.beardColor || cfg.hair || PAL.hairDark));
    beard.position.set(0, -0.055, 0.145);
    jaw.add(beard);
  }
  if (cfg.headwrap) {
    var wrap = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.095, 0.27), mat(cfg.headwrap));
    wrap.position.y = 0.145;
    head.add(wrap);
    var tail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.28, 0.05), mat(cfg.headwrap));
    tail.position.set(0.09, 0.0, -0.12);
    head.add(tail);
  }
  if (cfg.helmet) {
    var helm = new THREE.Mesh(new THREE.BoxGeometry(0.265, 0.13, 0.265), mat(PAL.armour));
    helm.position.y = 0.135;
    head.add(helm);
    var crest = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.085, 0.24), mat(PAL.armourLit));
    crest.position.y = 0.21;
    head.add(crest);
  }

  // ---- arms ----
  function arm(side) {
    var sh = new THREE.Group();
    sh.position.set(side * 0.255 * build, 0.30, 0);
    chest.add(sh);
    var upper = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.30, 0.095), cloth);
    upper.position.y = -0.15;
    upper.castShadow = true;
    sh.add(upper);
    var el = new THREE.Group();
    el.position.y = -0.30;
    sh.add(el);
    var fore = new THREE.Mesh(new THREE.BoxGeometry(0.082, 0.28, 0.082), skin);
    fore.position.y = -0.14;
    fore.castShadow = true;
    el.add(fore);
    var hand = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.10, 0.075), skin);
    hand.position.y = -0.31;
    el.add(hand);
    sh.rotation.z = side * 0.09;
    return { sh: sh, el: el, hand: hand };
  }
  var armL = arm(-1), armR = arm(1);
  if (watch) armL.el.add(watch);     // worn on the left wrist

  // ---- legs (hidden under the robe but they carry the walk) ----
  function leg(side) {
    var hip = new THREE.Group();
    hip.position.set(side * 0.115, 0.0, 0);
    hips.add(hip);
    var thigh = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.42, 0.13), under);
    thigh.position.y = -0.21;
    hip.add(thigh);
    var knee = new THREE.Group();
    knee.position.y = -0.42;
    hip.add(knee);
    var shin = new THREE.Mesh(new THREE.BoxGeometry(0.105, 0.42, 0.11), under);
    shin.position.y = -0.21;
    knee.add(shin);
    var foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.055, 0.225), mat(PAL.leather));
    foot.position.set(0, -0.45, 0.045);
    knee.add(foot);
    return { hip: hip, knee: knee, foot: foot };
  }
  var legL = leg(-1), legR = leg(1);

  return {
    root: P, hips: hips, torso: torso, chest: chest, neck: neck, head: head,
    jaw: jaw, mouth: mouth, brow: brow, eyeL: eyeL, eyeR: eyeR,
    armL: armL, armR: armR, legL: legL, legR: legR, robe: robe,
    jacket: jacket, watch: watch,
    // per-character animation state, eased toward targets every frame
    s: {
      lean: 0, slump: 0, headDown: 0, headTurn: 0, headTilt: 0,
      browAngle: 0, browRaise: 0, lidDrop: 0, jawOpen: 0,
      armUpL: 0, armUpR: 0, reach: 0, point: 0, shield: 0,
      kneel: 0, fallen: 0, walk: 0, walkPhase: 0, talking: 0,
      blinkT: rnd() * 3, breathT: rnd() * 6.28, sway: rnd() * 6.28
    }
  };
}


// ===== animations/perform.js ===================================
// animations/perform.js — what makes a figure look alive.
//
// Two layers. Involuntary motion (breath, blink, weight shift, the drift of a
// head) runs on its own timers and never stops, so nobody is ever a statue.
// Voluntary motion (point, shield, kneel, reach, walk) is a set of 0..1 targets
// that beats set and this module eases toward, so a cut never catches a body
// mid-snap.

function ease(cur, target, rate, dt) {
  return cur + (target - cur) * (1 - Math.exp(-rate * dt));
}

// Mouths open only while their own line is being spoken. There is no forced
// aligner on this machine, so this is a speech ENVELOPE, not visemes: the jaw
// rides a fast carrier (syllable-rate) under a slower amplitude curve, and
// closes in the measured pauses inside the line. It reads correctly at these
// shot sizes; it is not phoneme-matched, and the storyboard says so.
function jawEnvelope(t, lineT, lineD, seed) {
  if (lineT === null || t < lineT || t > lineT + lineD) return 0;
  var u = (t - lineT) / Math.max(0.0001, lineD);
  // taper in and out so a line does not begin or end with a snapped jaw
  var amp = Math.min(1, Math.min(u, 1 - u) * 9);
  var carrier = 0.5 + 0.5 * Math.sin((t + seed) * 15.5);
  var slow = 0.55 + 0.45 * Math.sin((t * 2.3 + seed) * 1.7);
  return amp * carrier * slow;
}

function animatePerson(c, t, dt) {
  var s = c.s;

  // ---- involuntary ----
  s.breathT += dt * (0.95 + s.talking * 0.5 + s.fallen * 0.9);
  var breath = Math.sin(s.breathT) * 0.5 + 0.5;
  c.chest.scale.set(1 + breath * 0.022, 1 + breath * 0.016, 1 + breath * 0.026);
  c.chest.position.y = 0.26 + breath * 0.009;

  s.sway += dt * 0.37;
  var sway = Math.sin(s.sway) * 0.012 + Math.sin(s.sway * 0.41) * 0.008;

  s.blinkT -= dt;
  var blink = 0;
  if (s.blinkT < 0) {
    blink = Math.min(1, -s.blinkT * 11);
    if (s.blinkT < -0.14) { s.blinkT = 2.1 + rnd() * 3.4; }
  }

  // ---- spine ----
  var leanA = s.lean * 0.21 + s.fallen * 0.1;
  c.torso.rotation.x = ease(c.torso.rotation.x, leanA - s.slump * 0.05, 7, dt);
  c.torso.rotation.z = ease(c.torso.rotation.z, sway + s.fallen * 0.14, 5, dt);
  c.chest.rotation.x = ease(c.chest.rotation.x, s.slump * 0.17, 6, dt);

  // ---- head ----
  var hd = s.headDown * 0.34 + s.slump * 0.1 - s.browRaise * 0.05;
  c.neck.rotation.x = ease(c.neck.rotation.x, hd, 7, dt);
  c.head.rotation.y = ease(c.head.rotation.y, s.headTurn * 0.5, 6, dt);
  c.head.rotation.z = ease(c.head.rotation.z, s.headTilt * 0.22 + sway * 0.5, 6, dt);
  c.head.rotation.x = ease(c.head.rotation.x, Math.sin(s.breathT * 0.31) * 0.012, 4, dt);

  // ---- face ----
  c.jaw.rotation.x = ease(c.jaw.rotation.x, s.jawOpen * 0.30, 26, dt);
  c.mouth.scale.y = 1 + s.jawOpen * 2.2;

  // lids: blink, plus the heavy half-lidded look of the blind stretch
  var lidY = 0.044 - (blink * 0.046) - (s.lidDrop * 0.030);
  c.eyeL.lid.position.y = ease(c.eyeL.lid.position.y, lidY, 24, dt);
  c.eyeR.lid.position.y = c.eyeL.lid.position.y;

  // brows do the emotional work: angry drives the inner ends down, fear up
  var bz = s.browAngle * 0.42;
  c.eyeL.brow.rotation.z = ease(c.eyeL.brow.rotation.z, -bz, 10, dt);
  c.eyeR.brow.rotation.z = ease(c.eyeR.brow.rotation.z, bz, 10, dt);
  var by = 0.052 + s.browRaise * 0.022 - Math.max(0, s.browAngle) * 0.012;
  c.eyeL.brow.position.y = ease(c.eyeL.brow.position.y, by, 10, dt);
  c.eyeR.brow.position.y = c.eyeL.brow.position.y;

  // eyes go dead during blindness - no iris tracking, nothing to track with
  var irisZ = 0.004 - s.lidDrop * 0.002;
  c.eyeL.iris.position.z = irisZ;
  c.eyeR.iris.position.z = irisZ;

  // ---- arms ----
  // shield: both forearms up across the face, the Damascus-road gesture
  var shL = -s.armUpL * 1.5 - s.shield * 2.25 - s.reach * 1.35 - s.point * 0.2;
  var shR = -s.armUpR * 1.5 - s.shield * 2.25 - s.reach * 1.35 - s.point * 1.6;
  c.armL.sh.rotation.x = ease(c.armL.sh.rotation.x, shL, 8, dt);
  c.armR.sh.rotation.x = ease(c.armR.sh.rotation.x, shR, 8, dt);
  c.armL.sh.rotation.z = ease(c.armL.sh.rotation.z, -0.09 - s.shield * 0.5 + s.reach * 0.22, 8, dt);
  c.armR.sh.rotation.z = ease(c.armR.sh.rotation.z, 0.09 + s.shield * 0.5 - s.reach * 0.22 - s.point * 0.3, 8, dt);
  c.armL.el.rotation.x = ease(c.armL.el.rotation.x, -s.shield * 1.5 - s.armUpL * 0.7 - s.reach * 0.25, 8, dt);
  c.armR.el.rotation.x = ease(c.armR.el.rotation.x, -s.shield * 1.5 - s.armUpR * 0.7 - s.reach * 0.25 - s.point * 0.1, 8, dt);

  // talking gesture: the forward hand lifts a little on stressed syllables
  if (s.talking > 0.01 && s.shield < 0.1 && s.reach < 0.1) {
    var g = Math.sin(t * 3.1) * 0.5 + 0.5;
    c.armR.sh.rotation.x -= s.talking * g * 0.26;
    c.armR.el.rotation.x -= s.talking * g * 0.2;
  }

  // ---- legs: walk cycle, kneel, collapse ----
  if (s.walk > 0.01) {
    s.walkPhase += dt * 4.6 * s.walk;
    var w = s.walkPhase;
    c.legL.hip.rotation.x = Math.sin(w) * 0.55 * s.walk;
    c.legR.hip.rotation.x = Math.sin(w + Math.PI) * 0.55 * s.walk;
    c.legL.knee.rotation.x = Math.max(0, -Math.sin(w - 0.6)) * 0.72 * s.walk;
    c.legR.knee.rotation.x = Math.max(0, -Math.sin(w + Math.PI - 0.6)) * 0.72 * s.walk;
    // the body rises and falls on the stride, which is what sells a walk
    c.hips.position.y = 0.92 + Math.abs(Math.sin(w)) * 0.028 * s.walk;
    c.armL.sh.rotation.x += Math.sin(w + Math.PI) * 0.3 * s.walk;
    c.armR.sh.rotation.x += Math.sin(w) * 0.3 * s.walk;
  } else {
    c.legL.hip.rotation.x = ease(c.legL.hip.rotation.x, s.kneel * -1.45, 7, dt);
    c.legR.hip.rotation.x = ease(c.legR.hip.rotation.x, s.kneel * -0.3, 7, dt);
    c.legL.knee.rotation.x = ease(c.legL.knee.rotation.x, s.kneel * 1.5, 7, dt);
    c.legR.knee.rotation.x = ease(c.legR.knee.rotation.x, s.kneel * 1.5, 7, dt);
    c.hips.position.y = ease(c.hips.position.y,
      0.92 - s.kneel * 0.42 - s.fallen * 0.66, 6, dt);
  }

  // a fallen body pitches forward onto its hands
  c.root.rotation.x = ease(c.root.rotation.x, s.fallen * 0.3, 5, dt);
}


// ===== environments/sets.js ====================================
// environments/sets.js — the film's six locations.
//
// Continuity rule from the brief: the office tower the film opens on is one
// of the towers visible from the street and from both homes, so the city is
// a single consistent skyline seen from different windows. buildSkyline() is
// therefore shared, with a seeded layout that does not change between sets.

// ------------------------------------------------------------- shared city

var SKYLINE_SEED = 20261118;

function skylineRnd(state) {
  state.v = (state.v * 1103515245 + 12345) & 0x7fffffff;
  return state.v / 0x7fffffff;
}

// One deterministic skyline, reused by every set that can see the city, so
// the same towers appear from the office, both homes and the street.
function buildSkyline(opts) {
  opts = opts || {};
  var G = new THREE.Group();
  var st = { v: SKYLINE_SEED };
  var cols = [PAL.towerA, PAL.towerB, PAL.towerC, PAL.towerFar];
  var n = opts.count || 70;
  for (var i = 0; i < n; i++) {
    var w = 3 + skylineRnd(st) * 7;
    var d = 3 + skylineRnd(st) * 7;
    var h = 8 + skylineRnd(st) * 52;
    var band = Math.floor(skylineRnd(st) * 4);
    var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(cols[band]));
    var ang = skylineRnd(st) * Math.PI * 2;
    var rad = 45 + skylineRnd(st) * 190;
    b.position.set(Math.sin(ang) * rad, h / 2, -Math.abs(Math.cos(ang)) * rad - 30);
    G.add(b);

    // lit windows: a single emissive slab per face reads better at distance
    // than hundreds of quads, and costs one draw call
    if (opts.lit) {
      var winM = new THREE.MeshBasicMaterial({
        color: 0xffd9a0, transparent: true,
        opacity: 0.25 + skylineRnd(st) * 0.5
      });
      var win = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.82, h * 0.86), winM);
      win.position.set(b.position.x, b.position.y, b.position.z + d / 2 + 0.06);
      G.add(win);
    }
  }
  return G;
}

function groundPlane(size, col) {
  var m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat(col));
  m.rotation.x = -Math.PI / 2;
  m.receiveShadow = true;
  return m;
}

function framedPhoto(w, h) {
  // The family photograph: the film's recurring object. Deliberately
  // abstract - two adults and a child as flat shapes, never a face, because
  // a legible rendered face at this scale would look worse than a suggestion.
  var G = new THREE.Group();
  var frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.02), mat(0x3a2f26));
  G.add(frame);
  var img = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.84, h * 0.84), mat(0x9ab0c0));
  img.position.z = 0.012;
  G.add(img);
  var figs = [[-0.26, 0.52, 0x4a5668], [0.26, 0.52, 0xb88ca0], [0, 0.40, 0x7a8f6a]];
  for (var i = 0; i < figs.length; i++) {
    var body = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.17, h * figs[i][1] * 0.42, 0.01), mat(figs[i][2]));
    body.position.set(w * figs[i][0], -h * 0.08, 0.016);
    G.add(body);
    var head = new THREE.Mesh(new THREE.BoxGeometry(w * 0.1, w * 0.1, 0.01),
                              mat(PAL.skinA));
    head.position.set(w * figs[i][0], -h * 0.08 + h * figs[i][1] * 0.26, 0.016);
    G.add(head);
  }
  return G;
}

function officeChair() {
  var G = new THREE.Group();
  var seat = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.1, 0.54), mat(PAL.leatherChair));
  seat.position.y = 0.46;

  var post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.42, 6), mat(PAL.steelDark));
  post.position.y = 0.23;

  for (var i = 0; i < 5; i++) {

    leg.position.set(Math.sin(a) * 0.15, 0.04, Math.cos(a) * 0.15);

function buildLights(scene) {
  var amb = new THREE.HemisphereLight(0xcfe0f0, 0x9a9288, 1.05);
  scene.add(amb);

  var sun = new THREE.DirectionalLight(0xffe6c0, 2.9);
  sun.position.set(16, 26, 14);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 110;
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -30;
  sun.shadow.bias = -0.0012;
  scene.add(sun);

  // interior practicals: the table lamps, and the hospital's ceiling wash
  var lampA = new THREE.PointLight(PAL.lampGlow, 0, 7, 1.8);
  var lampB = new THREE.PointLight(PAL.lampGlow, 0, 7, 1.8);
  scene.add(lampA);
  scene.add(lampB);

  var fluoro = new THREE.DirectionalLight(PAL.fluoro, 0);
  fluoro.position.set(0, 12, 2);
  scene.add(fluoro);

  scene.fog = new THREE.Fog(0xc8d8e8, 40, 260);

  // Skydome: the interiors have big windows and the exteriors look at a
  // horizon, so without geometry up there the frame shows the clear colour
  // as a hard band. Horizon takes the fog colour so the ground never seams.
  var skyGeo = new THREE.SphereGeometry(360, 18, 12);
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x7fb0e0) },
      bottom: { value: new THREE.Color(0xc8d8e8) }
    },
    vertexShader:
      'varying float h;\n' +
      'void main(){ vec4 w = modelMatrix * vec4(position,1.0);' +
      ' h = normalize(w.xyz).y;' +
      ' gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader:
      'uniform vec3 top; uniform vec3 bottom; varying float h;\n' +
      'void main(){ float m = clamp(h*1.5+0.18, 0.0, 1.0);' +
      ' m = m*m*(3.0-2.0*m);' +
      ' gl_FragColor = vec4(mix(bottom, top, m), 1.0); }'
  });
  var sky = new THREE.Mesh(skyGeo, skyMat);
  sky.renderOrder = -1;
  scene.add(sky);

  return { amb: amb, sun: sun, lampA: lampA, lampB: lampB, fluoro: fluoro,
           sky: sky, skyMat: skyMat };
}


// ===== cameras/solve.js ========================================
// cameras/solve.js — shots computed from where people actually stand.
//
// Hand-typed camera coordinates drift out of agreement with staging the
// moment a character moves, and the error is invisible until you look at a
// rendered frame. (On the first Saul render: jSaulCU aimed at empty road
// because Saul had moved, and jFearCU sat inside a building.) These helpers
// derive a shot from a live subject instead, so staging and camera cannot
// disagree.
//
// A derived shot is resolved every frame, so it also tracks a walking subject.

var EYE = 1.62;           // eye height of an average figure, in world units

// Where is this character's head right now, in world space?
function headOf(c, out) {
  if (!c) return out.set(0, EYE, 0);
  c.head.getWorldPosition(out);
  return out;
}

// A close-up: stand in FRONT of the subject's face at `dist`, offset by
// `yaw` radians, looking at the head.
//
// The camera goes where the face is pointing, not behind the subject: a
// figure's root rotation is its facing, so the camera must sit along +facing,
// and `yaw` then swings it off-axis for a three-quarter view. Getting this
// backwards puts the camera behind the head, which on the first pass filled a
// third of the frame with the back of someone's skull while the speaker stood
// small in the distance.
//
// `blockers` lists figures that must not come between camera and subject. If
// one is close to the camera-subject line, the shot swings to the other side
// rather than shooting through them. Cheap, and it catches the case that
// hand-typed coordinates never could: someone having moved into the shot.
function cu(subject, opts) {
  opts = opts || {};
  var vb = new THREE.Vector3();
  return {
    derive: function (t, v, look) {
      headOf(subject, look);
      var base = (subject ? subject.root.rotation.y : 0);
      var yaw = base + (opts.yaw || 0);
      var d = opts.dist || 2.6;

      // does anyone stand near the line from here to the subject?
      var flip = 1;
      var list = opts.blockers;
      if (list) {
        for (var i = 0; i < list.length; i++) {
          var o = list[i];
          if (!o || o === subject || !o.root.visible) continue;
          headOf(o, vb);
          var cx = look.x + Math.sin(yaw) * d - vb.x;
          var cz = look.z + Math.cos(yaw) * d - vb.z;
          if (Math.sqrt(cx * cx + cz * cz) < 0.95) { flip = -1; break; }
        }
      }
      yaw = base + (opts.yaw || 0) * flip;
      v.set(look.x + Math.sin(yaw) * d,
            look.y + (opts.rise === undefined ? 0.10 : opts.rise),
            look.z + Math.cos(yaw) * d);
      // Frame head and shoulders, not just a face: aim a little below the
      // eyes so the skull is not clipped by the top of frame.
      look.y -= 0.12;
    },
    fov: opts.fov || 27,
    drift: opts.drift || [0.16, 0.08, 0.05]
  };
}

// A two-shot: frame both subjects, backing off far enough to hold them both.
function two(a, b, opts) {
  opts = opts || {};
  var vb = new THREE.Vector3();
  return {
    derive: function (t, v, look) {
      headOf(a, v);
      headOf(b, vb);
      look.set((v.x + vb.x) / 2, (v.y + vb.y) / 2 - 0.08, (v.z + vb.z) / 2);
      var sep = v.distanceTo(vb);
      var yaw = (opts.yaw || 0) + Math.atan2(vb.x - v.x, vb.z - v.z) + Math.PI / 2;
      var d = (opts.dist || 2.1) + sep * 0.55;
      v.set(look.x + Math.sin(yaw) * d,
            look.y + (opts.rise === undefined ? 0.28 : opts.rise),
            look.z + Math.cos(yaw) * d);
    },
    fov: opts.fov || 34,
    drift: opts.drift || [0.24, 0.1, 0.1]
  };
}

// Over-the-shoulder: behind `near`, looking past them at `far`.
function over(near, far, opts) {
  opts = opts || {};
  var vf = new THREE.Vector3();
  return {
    derive: function (t, v, look) {
      headOf(near, v);
      headOf(far, vf);
      look.copy(vf);
      var dx = vf.x - v.x, dz = vf.z - v.z;
      var len = Math.max(0.001, Math.sqrt(dx * dx + dz * dz));
      var back = opts.back || 1.0, side = opts.side === undefined ? 0.45 : opts.side;
      v.x -= (dx / len) * back - (dz / len) * side;
      v.z -= (dz / len) * back + (dx / len) * side;
      v.y += opts.rise === undefined ? 0.22 : opts.rise;
    },
    fov: opts.fov || 33,
    drift: opts.drift || [0.2, 0.09, 0.08]
  };
}

// A wide that keeps the subject in frame from a fixed direction.
function wideOn(subject, opts) {
  opts = opts || {};
  return {
    derive: function (t, v, look) {
      headOf(subject, v);
      // Track the subject's own head height rather than a fixed world Y:
      // a kneeling or fallen figure needs a lower aim than a standing one,
      // and a fixed value crops whoever does not match it.
      look.set(v.x, v.y - (opts.below === undefined ? 0.35 : opts.below), v.z);
      if (opts.lookY !== undefined) look.y = opts.lookY;
      var yaw = (opts.yaw || 0);
      var d = opts.dist || 6.5;
      v.set(look.x + Math.sin(yaw) * d,
            opts.height === undefined ? 2.4 : opts.height,
            look.z + Math.cos(yaw) * d);
    },
    fov: opts.fov || 40,
    drift: opts.drift || [0.42, 0.16, 0.2]
  };
}

// A low hero angle, looking up at the subject.
function hero(subject, opts) {
  opts = opts || {};
  return {
    derive: function (t, v, look) {
      headOf(subject, v);
      look.copy(v);
      look.y += 0.1;
      // in front of the face, like cu() - a hero angle shot from behind is
      // just the back of a head seen from the floor
      var yaw = (subject ? subject.root.rotation.y : 0) + (opts.yaw || 0);
      var d = opts.dist || 3.1;
      v.set(look.x + Math.sin(yaw) * d,
            opts.height === undefined ? 0.85 : opts.height,
            look.z + Math.cos(yaw) * d);
    },
    fov: opts.fov || 34,
    drift: opts.drift || [0.18, 0.1, 0.08]
  };
}

// Looking straight up from beside a fallen subject - the light overhead.
function lookUp(subject, opts) {
  opts = opts || {};
  return {
    derive: function (t, v, look) {
      headOf(subject, v);
      v.y += 0.1;
      v.x += opts.dx || 0.9;
      v.z += opts.dz || 0.8;
      look.set(v.x * 0.2, (opts.lookY || 7.0), (v.z - 1.0));
    },
    fov: opts.fov || 46,
    drift: opts.drift || [0.22, 0.1, 0.12]
  };
}

// An orbit around a subject, from `from` to `to` radians across the beat.
function orbitOn(subject, opts) {
  opts = opts || {};
  return {
    derive: function (t, v, look, u) {
      headOf(subject, look);
      look.y -= opts.drop === undefined ? 0.2 : opts.drop;
      var a = (opts.from || 0.7) + ((opts.to === undefined ? -0.5 : opts.to) - (opts.from || 0.7)) * smoothstep(u);
      var r = opts.r || 4.2;
      v.set(look.x + Math.sin(a) * r,
            opts.height === undefined ? 2.1 : opts.height,
            look.z + Math.cos(a) * r);
    },
    fov: opts.fov || 34,
    drift: opts.drift || [0.2, 0.1, 0.1]
  };
}

function smoothstep(x) {
  x = x < 0 ? 0 : (x > 1 ? 1 : x);
  return x * x * (3 - 2 * x);

function bez3(p, u, out) {
  var v = 1 - u;
  out.set(
    v * v * p[0][0] + 2 * v * u * p[1][0] + u * u * p[2][0],
    v * v * p[0][1] + 2 * v * u * p[1][1] + u * u * p[2][1],
    v * v * p[0][2] + 2 * v * u * p[1][2] + u * u * p[2][2]
  );
  return out;
}

// ===== characters/cast.js ======================================
// characters/cast.js — six speakers plus background life.
//
// The man is built ONCE and reused in every scene. His face, proportions and
// identity never change; what changes is the jacket (removed after the
// collapse), the tie (gone by the apartment), the watch (taken off on camera
// in scene 6) and his shirt colour. The brief is explicit that the character
// must stay the same person throughout, so nothing else is allowed to vary.

function buildCast() {
  var C = {};

  C.man = buildPerson({
    modern: true, skin: PAL.skinA, robe: PAL.shirtWhite,
    trousers: PAL.suitCharcoal, jacket: PAL.suitNavy, tie: PAL.tieA,
    watch: PAL.watch, hair: PAL.hairSalt, beard: false,
    height: 1.03, build: 1.02, eye: 0x3a3028
  });

  C.asst = buildPerson({
    modern: true, skin: PAL.skinD, robe: PAL.blouse,
    trousers: PAL.skirtDark, jacket: PAL.skirtDark,
    hair: PAL.hairBlonde, height: 0.96, build: 0.95, eye: 0x3a4a3a
  });

  C.wife = buildPerson({
    modern: true, skin: PAL.skinD, robe: PAL.blouse,
    trousers: PAL.skirtDark, hair: PAL.hairWife,
    height: 0.96, build: 0.96, eye: 0x4a3828
  });

  C.doc = buildPerson({
    modern: true, skin: PAL.skinB, robe: PAL.scrubs,
    trousers: PAL.scrubs, jacket: PAL.coat,
    hair: PAL.hairDark, height: 1.0, build: 1.0, eye: 0x332a22
  });

  C.friend = buildPerson({
    modern: true, skin: PAL.skinC, robe: PAL.friendShirt,
    trousers: PAL.jeans, jacket: PAL.friendJacket,
    hair: PAL.hairDark, beard: true, height: 1.01, build: 1.06, eye: 0x2e2620
  });

  // background life: hospital staff, pedestrians. Never the focus, but the
  // brief asks for a world that keeps running, so they exist.
  C.extras = [];
  var ecfg = [
    { skin: PAL.skinB, shirt: PAL.scrubs, tr: PAL.scrubs, hair: PAL.hairDark, h: 0.97 },
    { skin: PAL.skinD, shirt: PAL.coat, tr: PAL.scrubs, hair: PAL.hairBlonde, h: 0.95 },
    { skin: PAL.skinC, shirt: PAL.plainShirt, tr: PAL.jeans, hair: PAL.hairMid, h: 1.0 },
    { skin: PAL.skinA, shirt: PAL.plainShirtAlt, tr: PAL.suitCharcoal, hair: PAL.hairGrey, h: 0.99 },
    { skin: PAL.skinD, shirt: PAL.blouse, tr: PAL.skirtDark, hair: PAL.hairWife, h: 0.94 },
    { skin: PAL.skinB, shirt: PAL.friendShirt, tr: PAL.jeans, hair: PAL.hairDark, h: 1.02 },
    { skin: PAL.skinA, shirt: PAL.plainShirt, tr: PAL.jeans, hair: PAL.hairSalt, h: 0.98 },
    { skin: PAL.skinC, shirt: PAL.shirtWhite, tr: PAL.suitNavy, hair: PAL.hairDark, h: 1.01 }
  ];
  for (var i = 0; i < ecfg.length; i++) {
    var e = ecfg[i];
    C.extras.push(buildPerson({
      modern: true, skin: e.skin, robe: e.shirt, trousers: e.tr,
      hair: e.hair, height: e.h, build: 0.95 + (i % 4) * 0.04
    }));
  }

  return C;
}

function castList(C) {
  return [C.man, C.asst, C.wife, C.doc, C.friend].concat(C.extras);
}

function hideAll(C) {
  var l = castList(C);
  for (var i = 0; i < l.length; i++) l[i].root.visible = false;
}

function place(c, x, z, ry, y) {
  c.root.visible = true;
  c.root.position.set(x, y === undefined ? 0 : y, z);
  c.root.rotation.y = ry === undefined ? 0 : ry;
}

function clearPose(c) {
  var s = c.s;
  s.lean = 0; s.slump = 0; s.headDown = 0; s.headTurn = 0; s.headTilt = 0;
  s.browAngle = 0; s.browRaise = 0; s.lidDrop = 0;
  s.armUpL = 0; s.armUpR = 0; s.reach = 0; s.point = 0; s.shield = 0;
  s.kneel = 0; s.fallen = 0; s.walk = 0;
}

// The man's decline, applied as a single function so it can never get out of
// step with itself. 0 = the opening, 1 = the apartment.
function setDecline(C, level) {
  var m = C.man;
  if (m.jacket) m.jacket.visible = level < 0.5;
  m.robe.material.color.setHex(level < 0.5 ? PAL.suitCharcoal : PAL.jeans);
  // posture floor: he never fully straightens again until scene 10
  m.s.slump = Math.max(m.s.slump, level * 0.35);
}

function setWatch(C, on) {
  if (C.man.watch) C.man.watch.visible = !!on;
}

// --------------------------------------------------------------- staging

function stageScene(n, C, SETS) {
  hideAll(C);
  for (var k in SETS) if (SETS[k]) SETS[k].visible = false;
  var l = castList(C);
  for (var i = 0; i < l.length; i++) clearPose(l[i]);

  // 1-2: the executive office
  if (n === 1 || n === 2) {
    SETS.office.visible = true;
    setDecline(C, 0);
    setWatch(C, true);
    // cu() stands in FRONT of a face, i.e. along the subject's own facing,
    // so whatever a character faces ends up BEHIND the camera and whatever
    // is at their back becomes the backdrop. The office's furniture sits at
    // z=-2.4 (desk) to -6.9 (screen, shelves) and the glass wall at +5.2, so
    // the pair stand deep in the room with their backs to the furniture,
    // facing +z. Their close-ups then frame desk and shelves behind them.
    // Staged the other way round - which the first two passes did - every
    // face shot backs onto empty sky.
    place(C.man, 0.5, -3.3, 0.10);
    place(C.asst, -1.5, -4.4, 0.32);
    return;
  }

  // 3: the call - still the office, he is alone
  if (n === 3) {
    SETS.office.visible = true;
    setDecline(C, 0);
    setWatch(C, true);
    place(C.man, 0.45, -3.1, 0.08);
    return;
  }

  // 4: the hospital corridor
  if (n === 4) {
    SETS.hospital.visible = true;
    setDecline(C, 0.2);
    setWatch(C, true);
    place(C.man, 0.1, -3.2, Math.PI);          // facing down the corridor
    place(C.doc, -0.2, -7.4, 0);
    place(C.wife, 2.6, -2.0, -0.7);
    // staff at a distance, deliberately not the subject
    place(C.extras[0], -3.2, -9.5, 0.4);
    place(C.extras[1], 2.9, -10.2, -0.3);
    C.extras[0].s.walk = 0.4;
    C.extras[1].s.walk = 0.3;
    return;
  }

  // 5: the luxury house at night
  if (n === 5) {
    SETS.residence.visible = true;
    setDecline(C, 0.45);
    setWatch(C, true);
    place(C.man, -0.6, 0.55, 0.12);            // seated on the couch
    C.man.root.position.y = 0.30;
    C.man.s.kneel = 0.95;                      // reads as sitting
    C.man.s.slump = 0.7;
    C.man.s.headDown = 0.55;
    place(C.wife, 1.9, 2.2, Math.PI - 0.9);
    return;
  }

  // 6-11: the modest apartment
  if (n >= 6 && n <= 11) {
    SETS.apartment.visible = true;
    setDecline(C, 1);
    setWatch(C, n >= 7 ? false : true);        // the watch comes off in 6
    place(C.man, -1.1, -1.25, 0.30);
    C.man.root.position.y = 0.26;
    C.man.s.kneel = 0.95;
    C.man.s.slump = n <= 8 ? 0.55 : 0.3;
    if (n >= 7) {
      place(C.friend, 1.85, -0.5, -0.85);
      C.friend.root.position.y = 0.26;
      C.friend.s.kneel = 0.95;
    }
    if (n >= 10) {
      place(C.wife, -0.2, -1.5, 0.25);
      C.wife.root.position.y = 0.26;
      C.wife.s.kneel = 0.95;
    }
    return;
  }

  // 12: the street at sunrise
  if (n === 12) {
    SETS.street.visible = true;
    setDecline(C, 1);
    setWatch(C, false);
    place(C.man, -5.0, 2.0, Math.PI);
    C.man.s.walk = 1;
    C.man.s.slump = 0.12;
    // the city keeps running
    var ped = [[-6.2, -7, 0], [-4.4, -14, Math.PI], [5.6, -5, Math.PI],
               [6.4, -12, 0], [-5.8, -20, Math.PI], [5.2, -18, 0]];
    for (var p = 0; p < ped.length && p < C.extras.length; p++) {
      place(C.extras[p], ped[p][0], ped[p][1], ped[p][2]);
      C.extras[p].s.walk = 0.75 + (p % 3) * 0.12;
    }
    return;
  }
}


// ===== animations/acts.js ======================================
// animations/acts.js — one function per beat.
//
// Acts set targets only; perform.js eases toward them, so a cut never lands
// on a snapped pose. Listeners are posed too: a scene where only the speaker
// moves reads as two machines taking turns, and most of this film is two
// people in a room talking.

function buildActs(film) {
  function face(c, other) {
    if (!c || !other) return;
    var dx = other.root.position.x - c.root.position.x;
    var dz = other.root.position.z - c.root.position.z;
    var want = Math.atan2(dx, dz) - c.root.rotation.y;
    while (want > Math.PI) want -= Math.PI * 2;

// ===== scripts/transport.js ====================================
// scripts/transport.js — the clock, the beat dispatcher, and the frame loop.
//
// In playback the <audio> element IS the clock: every frame reads
// voice.currentTime, so picture cannot drift from sound no matter how the
// browser schedules frames. In render mode time is supplied in exact 1/30s
// steps instead, which makes the render deterministic and resumable.
//
// Beats are dispatched by onset, not by accumulation. Because each beat's `t`
// came from a measured speech onset, a cut can never land before its line is
// spoken.

var FPS = 30;

function makeTransport(opts) {
  var beats = opts.beats;
  var duration = opts.duration;
  var applyBeat = opts.applyBeat;
  var frame = opts.frame;
  var voice = opts.voice;
  var renderMode = opts.renderMode;

  var time = 0;
  var playing = false;
  var beatIdx = -1;
  var last = 0;

  // Find the beat that owns time t. Linear from the current index in playback
  // (cheap), binary search on seek (correct after a jump).
  function beatAt(t) {
    var lo = 0, hi = beats.length - 1, best = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (beats[mid].t <= t) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  function sync(t) {
    var want = beatAt(t);
    if (want !== beatIdx) {
      // When seeking forward over several beats, apply them in order so any
      // state they set (a character's pose, which set is visible) ends up
      // where it would have been had the film played through.
      var from = want < beatIdx ? 0 : beatIdx + 1;
      for (var i = from; i <= want; i++) applyBeat(beats[i], i, t);
      beatIdx = want;
    }
  }

  function step(t, dt) {
    time = t;
    sync(t);
    frame(t, dt);
  }

  // ---- playback ----
  function loop() {
    if (!playing) return;
    var t = voice.currentTime;
    var dt = Math.min(0.1, Math.max(0.0005, t - last));
    last = t;
    step(t, dt);
    if (t < duration) {
      requestAnimationFrame(loop);
    } else {
      playing = false;
    }
  }

  function play() {
    if (playing) return;
    playing = true;
    last = voice.currentTime;
    voice.play();
    requestAnimationFrame(loop);
  }

  function reset() {
    time = 0;
    beatIdx = -1;
    last = 0;
    applyBeat(beats[0], 0, 0);
    beatIdx = 0;
    step(0, 1 / FPS);
  }

  // ---- render mode ----
  // Advance in exact frame steps from wherever we are to the requested time,
  // so eased values (which integrate dt) land identically on every pass. A
  // shard that starts at frame 2000 must produce the same pixels as a full
  // run, so seekTo walks the easing forward rather than teleporting.
  function seekTo(t) {
    var steps = Math.round(t * FPS);
    for (var i = 0; i <= steps; i++) step(i / FPS, 1 / FPS);
  }

  function advanceTo(t) {
    var target = Math.round(t * FPS);
    var cur = Math.round(time * FPS);
    if (target < cur) { reset(); cur = 0; }
    for (var f = cur + 1; f <= target; f++) step(f / FPS, 1 / FPS);
    if (target === 0) step(0, 1 / FPS);
  }

  // Jump straight to t for inspection: apply every beat up to t, then run
  // `settle` frames so eased values land near their targets. Cheap, but NOT
  // frame-exact - renders must use advanceTo.
  function jumpTo(t, settle) {
    time = t;
    beatIdx = -1;
    sync(t);
    for (var i = 0; i < (settle || 20); i++) frame(t, 1 / FPS);
  }

  return {
    play: play, reset: reset, seekTo: seekTo, advanceTo: advanceTo,
    jumpTo: jumpTo,
    step: step, duration: duration,
    get time() { return time; },
    get beatIdx() { return beatIdx; }
  };
}


// ===== scripts/frame.js ========================================
// scripts/frame.js — one frame of the film.
//
// Order matters: actions set pose targets, the performance pass eases bodies
// toward them, the camera is solved from the current shot, then light and
// effects are interpolated and drawn. Everything here is a pure function of
// (t, dt) given the beat state, which is what makes the render deterministic.

function makeFilm(ctx) {
  var scene = ctx.scene, camera = ctx.camera, renderer = ctx.renderer;
  var C = ctx.cast, SETS = ctx.sets, L = ctx.lights;

  var curScene = 0;
  var curShot = SHOTS.oAerial, prevShot = SHOTS.oAerial;
  var shotT = 1, shotStart = 0, beatStart = 0, beatDur = 1;
  var mood = {}, targetMood = MOODS.empire;
  for (var k in MOODS.empire) mood[k] = MOODS.empire[k];

  var speaker = null, speakStart = 0, speakDur = 0;
  var blind = 0, blindTarget = 0;        // subjective blindness fade
  var scales = 0;                        // the scales-falling particles
  var subIdx = -1;

  var vTmp = new THREE.Vector3(), vLook = new THREE.Vector3();
  // scratch colours, reused every frame so the loop allocates nothing
  var vDer = new THREE.Vector3(), vDerLook = new THREE.Vector3();
  var cFog = new THREE.Color(), cSky = new THREE.Color();
  var cSun = new THREE.Color(), cAmbS = new THREE.Color(), cAmbG = new THREE.Color();
  var curSun = new THREE.Color(MOODS.empire.sunCol);
  var curAmbS = new THREE.Color(MOODS.empire.ambSky);
  var curAmbG = new THREE.Color(MOODS.empire.ambGnd);
  var curFog = new THREE.Color(MOODS.empire.fogCol);

  // Colour fields are eased in RGB, never as packed hex: lerping 0x3a4258
  // toward 0xffe6b0 as a NUMBER passes through greens that are in neither
  // colour. Everything else in a mood is a scalar and eases normally.
  var COLOR_KEYS = { sunCol: 1, ambSky: 1, ambGnd: 1, fogCol: 1, skyTop: 1 };

  // ----------------------------------------------------------- the beat
  function applyBeat(b, i, t) {
    if (b.sc !== curScene) {
      stageScene(b.sc, C, SETS);
      curScene = b.sc;
    }
    cutTo(SHOTS[b.cam], b.t, b.d, b.cam === "oAerial" ? 0 : 0.5);
    targetMood = MOODS[b.mood];
    speaker = C[b.who] || null;
    speakStart = b.t;
    speakDur = b.d;
    beatStart = b.t;
    beatDur = b.d;
    // read ctx.acts live: buildActs needs the film object, so the acts are
    // attached to ctx after makeFilm returns. Snapshotting it here would
    // capture null and every beat would be a no-op.
    var acts = ctx.acts;
    if (acts && acts[b.act]) acts[b.act](C, b, ctx);
    // reset the subcut cursor so a seek re-arms the right one
    subIdx = -1;
    for (var s = 0; s < SUBCUTS.length; s++) if (SUBCUTS[s].t <= t) subIdx = s;
  }

  function cutTo(shot, at, dur, blend) {
    if (!shot || shot === curShot) return;
    prevShot = sampleShot(curShot, at);
    curShot = shot;
    shotStart = at;
    shotT = (blend === undefined ? 0.5 : blend) <= 0 ? 1 : 0;
    curShot._blend = blend === undefined ? 0.5 : blend;
    curShot._in = at;
    curShot._dur = dur;
  }

  // Resolve a shot to a concrete position/look at time t, including its
  // Bezier path, its orbit and its drift. Returned as a plain object so a
  // blend can interpolate from where the previous shot actually was.
  function sampleShot(shot, t) {
    var inT = shot._in === undefined ? 0 : shot._in;
    var dur = shot._dur === undefined ? 4 : shot._dur;
    var u = dur > 0 ? Math.min(1, Math.max(0, (t - inT) / dur)) : 0;
    var eu = smoothstep(u);

    var px, py, pz;
    if (shot.derive) {
      // A derived shot is solved from live character positions, so it cannot
      // fall out of agreement with staging the way typed coordinates do.
      shot.derive(t, vDer, vDerLook, eu);
      px = vDer.x; py = vDer.y; pz = vDer.z;
      var d0 = shot.drift || [0.2, 0.1, 0.1];
      px += Math.sin(t * 0.17 + 1.3) * d0[0] * 0.14;
      py += Math.sin(t * 0.23 + 2.1) * d0[1] * 0.12;
      pz += Math.sin(t * 0.13 + 0.7) * d0[2] * 0.14;
      return { x: px, y: py, z: pz,
               lx: vDerLook.x, ly: vDerLook.y, lz: vDerLook.z,
               fov: shot.fov };
    }
    if (shot.path) {
      bez3(shot.path, eu, vTmp);
      px = vTmp.x; py = vTmp.y; pz = vTmp.z;
    } else if (shot.orbit) {
      var o = shot.orbit;
      var a = o.from + (o.to - o.from) * eu;
      px = o.c[0] + Math.sin(a) * o.r;
      py = o.y;
      pz = o.c[2] + Math.cos(a) * o.r;
    } else {
      px = shot.pos[0]; py = shot.pos[1]; pz = shot.pos[2];
    }

    // drift: a slow wander so nothing is ever locked off
    var d = shot.drift || [0.3, 0.12, 0.12];
    px += Math.sin(t * 0.17 + 1.3) * d[0] * 0.14;
    py += Math.sin(t * 0.23 + 2.1) * d[1] * 0.12;
    pz += Math.sin(t * 0.13 + 0.7) * d[2] * 0.14;

    var lk = shot.orbit ? shot.orbit.c : shot.look;
    return { x: px, y: py, z: pz,
             lx: lk[0], ly: lk[1], lz: lk[2], fov: shot.fov };
  }

  function solveCamera(t, dt) {
    // mid-line subcuts
    for (var s = subIdx + 1; s < SUBCUTS.length; s++) {
      if (SUBCUTS[s].t > t) break;
      subIdx = s;
      // A subcut belongs to its scene. Without this check a late subcut
      // survives the cut into the next scene and re-aims the camera at an
      // interior shot while an exterior is on stage - at t=150 the active
      // camera was hSaulCU, a scene-7 room shot, with scene 8 staged.
      if (SUBCUTS[s].sc !== undefined && SUBCUTS[s].sc !== curScene) continue;

    }

    var now = sampleShot(curShot, t);
    if (shotT < 1) {
      shotT = Math.min(1, shotT + dt / Math.max(0.0001, curShot._blend));
      var e = smoothstep(shotT);
      camera.position.set(
        prevShot.x + (now.x - prevShot.x) * e,
        prevShot.y + (now.y - prevShot.y) * e,
        prevShot.z + (now.z - prevShot.z) * e);
      vLook.set(
        prevShot.lx + (now.lx - prevShot.lx) * e,
        prevShot.ly + (now.ly - prevShot.ly) * e,
        prevShot.lz + (now.lz - prevShot.lz) * e);
      camera.fov = prevShot.fov + (now.fov - prevShot.fov) * e;
    } else {
      camera.position.set(now.x, now.y, now.z);
      vLook.set(now.lx, now.ly, now.lz);
      camera.fov = now.fov;
    }
    camera.lookAt(vLook);
    window.__lastLook = vLook;
    camera.updateProjectionMatrix();
  }

  // ---------------------------------------------------------- the frame
  function frame(t, dt) {
    // ---- performances ----
    var all = castList(C);
    for (var i = 0; i < all.length; i++) {
      var c = all[i];
      if (!c.root.visible) continue;
      // the speaker's jaw rides its own line's envelope; everyone else is shut
      var isSp = (c === speaker);
      c.s.talking = isSp ? 1 : 0;
      c.s.jawOpen = isSp ? jawEnvelope(t, speakStart, speakDur, i * 1.7) : 0;
      animatePerson(c, t, dt);
    }

    // Walking characters actually travel, along their own facing. Driven
    // off the pose state rather than named characters, so a cast change
    // cannot leave a dangling reference here.
    for (var w = 0; w < all.length; w++) {
      var wc = all[w];
      if (!wc.root.visible || wc.s.walk <= 0.01) continue;
      var spd = dt * 1.15 * wc.s.walk;
      wc.root.position.x += Math.sin(wc.root.rotation.y) * spd;
      wc.root.position.z += Math.cos(wc.root.rotation.y) * spd;
    }

    // ---- camera ----
    solveCamera(t, dt);

    // ---- light ----
    var kMood = 1 - Math.exp(-2.6 * dt);
    for (var k in targetMood) {
      if (COLOR_KEYS[k]) { mood[k] = targetMood[k]; continue; }
      var cur = mood[k], tg = targetMood[k];
      mood[k] = typeof tg === 'number' ? cur + (tg - cur) * kMood : tg;
    }
    curSun.lerp(cSun.setHex(mood.sunCol), kMood);
    curAmbS.lerp(cAmbS.setHex(mood.ambSky), kMood);
    curAmbG.lerp(cAmbG.setHex(mood.ambGnd), kMood);
    curFog.lerp(cFog.setHex(mood.fogCol), kMood);
    L.sun.intensity = mood.sun;
    L.sun.color.copy(curSun);
    L.amb.intensity = mood.amb;
    L.amb.color.copy(curAmbS);
    L.amb.groundColor.copy(curAmbG);
    scene.fog.near = mood.fogN;
    scene.fog.far = mood.fogF;
    scene.fog.color.copy(curFog);

    // The sky meets the fog at the horizon, so the ground plane's edge is
    // never visible as a seam. Both are eased as colours, not as numbers:
    // interpolating packed hex would travel through the wrong hues.
    if (L.skyMat) {
      L.skyMat.uniforms.bottom.value.copy(curFog);
      L.skyMat.uniforms.top.value.lerp(cSky.setHex(mood.skyTop), kMood);
    }
    renderer.toneMappingExposure = mood.exp * (1 - blind * 0.92);

    // ---- practicals ----
    // Lamp intensity comes from the mood, so it rises and falls with the
    // scene instead of being switched by scene number.
    var hs = SETS.residence.visible ? SETS.residence
           : (SETS.apartment.visible ? SETS.apartment : null);
    var lampWant = mood.lamp || 0;
    var flick = 1 + Math.sin(t * 1.7) * 0.015;      // steady; these are bulbs
    L.lampA.intensity = lampWant * 1.5 * flick;
    L.lampB.intensity = lampWant * 1.1 * (2 - flick);
    if (hs && hs.userData.lamps && hs.userData.lamps.length) {
      var lm = hs.userData.lamps;
      L.lampA.position.fromArray(lm[0].pos);
      if (lm[1]) L.lampB.position.fromArray(lm[1].pos);
      else L.lampB.intensity = 0;
    } else {
      L.lampA.intensity = 0;
      L.lampB.intensity = 0;
    }
    // the hospital's ceiling panels, which are the only light in scene 4
    L.fluoro.intensity = SETS.hospital.visible ? 1.5 : 0;

    // ---- rain outside the residence glass ----
    if (SETS.residence.visible && SETS.residence.userData.rain) {
      var R = SETS.residence.userData.rain;
      R.pts.material.opacity = (mood.rain || 0) * 0.5;
      if ((mood.rain || 0) > 0.01) {
        for (var ri = 0; ri < R.count; ri++) {
          var rs = R.seed[ri];
          R.pos[ri * 3 + 1] = 14 - ((t * rs.s + rs.y) % 14);
        }
        R.geo.attributes.position.needsUpdate = true;
      }
    }


    // ---- subjective blindness ----
    blind += (blindTarget - blind) * (1 - Math.exp(-1.6 * dt));
    if (ctx.vignette) {
      ctx.vignette.material.opacity = blind * 0.97;
      ctx.vignette.visible = blind > 0.004;
    }


    renderer.render(scene, camera);
  }

  return {
    applyBeat: applyBeat, frame: frame,
    setBlind: function (v) { blindTarget = v; },
    dropScales: function (t) { scales = 1; ctx.scalesT = t; },
    get mood() { return mood; }
  };
}



// ===== main ==============================================================
  var DURATION = 228.28;
  var RENDER_MODE = true;

  var canvas = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true,
                                           preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(1280, 720, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1280 / 720, 0.1, 400);

  var lights = buildLights(scene);

  // sets
  var SETS = {
    office: buildOffice(),
    hospital: buildHospital(),
    residence: buildResidence(),
    apartment: buildApartment(),
    street: buildStreet()
  };
  for (var sk in SETS) scene.add(SETS[sk]);

  // cast
  var cast = buildCast();
  var allCast = castList(cast);
  for (var ci = 0; ci < allCast.length; ci++) {
    allCast[ci].root.visible = false;
    scene.add(allCast[ci].root);
  }

  // Shots are derived from the cast, so they are built once the cast exists.
  buildShots(cast);

  // rain is built into the residence set; no other particle systems here.

  // a black plane locked to the camera: the subjective blindness fade
  var vignette = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true,
                                  opacity: 0, depthTest: false, depthWrite: false }));
  vignette.visible = false;
  vignette.renderOrder = 999;
  var vigCam = new THREE.Scene();
  vigCam.add(vignette);
  var orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  var ctx = {
    scene: scene, camera: camera, renderer: renderer,
    cast: cast, sets: SETS, lights: lights,
    shaft: null, motes: null, dustRoad: null,
    scalesFx: null, scalesT: 0, vignette: null,
    acts: null
  };

  var film = makeFilm(ctx);
  ctx.acts = buildActs(film);

  // The blindness fade is a second pass over the finished frame.
  var baseRender = renderer.render.bind(renderer);

  var voice = document.getElementById("voice");
  voice.src = AUDIO_SRC;

  var transport = makeTransport({
    beats: BEATS, duration: DURATION,
    applyBeat: film.applyBeat,
    frame: function (t, dt) {
      film.frame(t, dt);
      if (vignette.material.opacity > 0.004) {
        renderer.autoClear = false;
        baseRender(vigCam, orthoCam);
        renderer.autoClear = true;
      }
    },
    voice: voice, renderMode: RENDER_MODE
  });
  ctx.vignette = vignette;

  // ------------------------------------------------------------- playback
  var gate = document.getElementById("gate");
  if (RENDER_MODE) {
    gate.className = "off";
    transport.reset();
    window.__film = {
      duration: DURATION,
      reset: function () { transport.reset(); },
      seekTo: function (t) { transport.advanceTo(t); },
      grab: function (t) {
        transport.advanceTo(t);
        return canvas.toDataURL("image/jpeg", 0.92);
      },
      // Framing check only: jump to t and settle the easing over a few
      // frames instead of replaying the film. Not frame-exact, so never used
      // for a real render - but camera and pose are right, which is what a
      // look needs.
      peek: function (t) {
        transport.jumpTo(t, 30);
        return canvas.toDataURL("image/jpeg", 0.92);
      }
    };
    // Debug hook: report where the camera is and who is actually in front
    // of it. Looking at one frame cannot tell you whether a figure is
    // missing or merely out of shot; this can.
    window.__dbg = function () {
      var out = { cam: camera.position.toArray().map(function (n) { return +n.toFixed(2); }),
                  visible: [], inFrustum: [] };
      camera.updateMatrixWorld();
      var m = new THREE.Matrix4().multiplyMatrices(
        camera.projectionMatrix, camera.matrixWorldInverse);
      var fr = new THREE.Frustum().setFromProjectionMatrix(m);
      var names = ['man','asst','wife','doc','friend'];
      for (var i = 0; i < names.length; i++) {
        var c = cast[names[i]];
        if (!c || !c.root.visible) continue;
        out.visible.push(names[i]);
        var v = new THREE.Vector3();
        c.head.getWorldPosition(v);
        if (fr.containsPoint(v)) out.inFrustum.push(names[i]);
      }
      out.look = window.__lastLook ? window.__lastLook.toArray().map(function(n){return +n.toFixed(2);}) : null;
      out.asstPos = cast.asst.root.position.toArray().map(function(n){return +n.toFixed(2);});
      out.asstRotY = +cast.asst.root.rotation.y.toFixed(2);
      out.manPos = cast.man.root.position.toArray().map(function(n){return +n.toFixed(2);});
      out.sets = {};
      for (var sk in SETS) {
        out.sets[sk] = SETS[sk].visible ? SETS[sk].children.length : false;
      }
      return out;
    };
    window.__filmReady = true;
  } else {
    transport.reset();
    var start = function () {
      gate.className = "off";
      transport.play();
    };
    gate.addEventListener("click", start);
    window.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") start();
    });
    window.__filmReady = true;
  }

})();
</script>
